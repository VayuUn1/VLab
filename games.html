
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLAB - Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="games.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">VLAB</a>
    <a href="https://youtube.com/@vayuuniverse?si=395iofnKy6U71OLx" target="_blank" rel="noopener noreferrer">YouTube</a>
  </header>

  <main>
    <section class="hero">
      <h1>WELCOME TO VLAB</h1>
      <p>PLAY ANY GAMES</p>
      <button id="post-game-btn" type="button">POST GAME +</button>
    </section>

    <section class="game-library">
      <div id="game-grid"></div>
      <p id="empty-games">No games yet. Be the first to post one!</p>
    </section>
  </main>

  <div id="post-game-overlay" class="post-game-overlay" hidden>
    <div class="post-game-popup" role="dialog" aria-modal="true" aria-labelledby="upload-title">

      <button id="close-post-game" type="button" aria-label="Close">✕</button>

      <h2 id="upload-title">POST YOUR GAME</h2>

      <form id="post-game-form">

        <div class="form-group">
          <label for="game-title">Game Title *</label>
          <input id="game-title" type="text" maxlength="60" required placeholder="Enter game title">
        </div>

        <div class="form-group">
          <label for="game-description">Description (Optional)</label>
          <textarea id="game-description" maxlength="300" placeholder="Describe your game"></textarea>
        </div>

        <div class="form-group">
          <label for="game-file">Game File (.html) *</label>
          <input id="game-file" type="file" accept=".html,text/html" required>
        </div>

        <div class="form-group">
          <label for="game-cover">Cover Image (Optional)</label>
          <input id="game-cover" type="file" accept="image/png,image/jpeg,image/webp">
          <div class="cover-preview-container">
            <img id="cover-preview" src="default-game-cover.jpg" alt="VLAB game cover">
          </div>
        </div>

        <p id="upload-status" role="status" aria-live="polite"></p>

        <button id="submit-game-btn" type="submit">PUBLISH GAME</button>

      </form>
    </div>
  </div>

  <script src="games.js" defer></script>
</body>
</html>
